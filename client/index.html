<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delirio</title>
    <style>
      :root {
        --bg: #0d0b12;
        --panel: #16131d;
        --line: #2c2735;
        --text: #b9b3a6;
        --muted: #6f6979;
        --accent: #5fcde4;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
      body {
        display: flex;
        font: 13px/1.4 ui-monospace, "Cascadia Mono", monospace;
        overflow: hidden;
      }
      #game {
        position: relative;
        flex: 0 0 68%;
        overflow: hidden;
        background: #000;
      }
      .pause {
        position: absolute;
        inset: 0;
        z-index: 2; /* always above the map book */
        display: grid;
        place-items: center;
        background: rgba(9, 7, 16, 0.78);
      }
      .pause[hidden] { display: none; }
      .pause-box { text-align: center; }
      .pause-title { margin: 0 0 24px; font-size: 32px; letter-spacing: 0.2em; color: #d8cfb8; }
      .pause-resume {
        padding: 12px 40px;
        font: inherit;
        font-size: 16px;
        color: #0d0b12;
        background: #d8cfb8;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      .pause-resume:hover { background: #fff; }
      .pause-new { display: block; margin: 12px auto 0; padding: 6px 16px; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
      .pause-new:hover { color: var(--text); border-color: var(--muted); }
      .pause-help, .pause-options { margin: 16px 0 0; color: var(--muted); }
      .pause-error { min-height: 1.4em; margin: 12px 0 0; color: #d95763; }
      #game canvas { display: block; image-rendering: pixelated; }
      .map-book {
        position: absolute;
        z-index: 1;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        image-rendering: pixelated;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      }
      /* #game in the selector: it has to beat "#game canvas { display: block }" */
      #game .map-book[hidden] { display: none; }
      .cursor {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
        pointer-events: none;
        image-rendering: pixelated;
      }
      .cursor[hidden] { display: none; }
      #panel {
        flex: 1;
        min-width: 0;
        padding: 16px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        overflow-y: auto;
      }
      .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
      .tab {
        flex: 1;
        padding: 6px 4px;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        background: none;
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
        margin-bottom: -1px;
        cursor: pointer;
      }
      .tab:hover, .tab.is-hover { color: var(--text); }
      .tab.is-selected { color: var(--accent); background: var(--panel); border-color: var(--line); }
      .tab-page[hidden] { display: none; }
      #panel h2 {
        margin: 18px 0 8px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #panel h2:first-child, .tab-page > h2:first-child { margin-top: 0; }
      .slots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
      .slot {
        position: relative;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        padding: 0;
        background: #0f0d14;
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: pointer;
      }
      .slot:hover, .slot.is-hover { border-color: var(--muted); }
      .slot.is-selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
      .slot canvas { width: 88%; image-rendering: pixelated; }
      .slot.is-dragging canvas { opacity: 0.3; }
      .slot .count { position: absolute; right: 4px; bottom: 2px; font-size: 11px; color: var(--text); }
      /* Equipment: the player on a lit backdrop, a square on each body part */
      .doll {
        position: relative;
        height: 320px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: radial-gradient(ellipse at 50% 55%, #8a8f99 0%, #6a6e78 45%, #3e4049 100%);
      }
      .doll canvas { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); image-rendering: pixelated; }
      .doll .equip { position: absolute; width: 52px; background: rgba(15, 13, 20, 0.85); }
      .doll .equip::after {
        content: attr(data-label);
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-top: 2px;
        font-size: 10px;
        white-space: nowrap;
        color: #e8e6ee;
        text-shadow: 0 1px 2px #000;
      }
      .doll .equip.is-empty { border-style: dashed; border-color: #2a2833; }
      .equip-head { left: 10px; top: 48px; }
      .equip-body { left: 10px; top: 130px; }
      .equip-legs { left: 10px; top: 212px; }
      .equip-rightHand { right: 10px; top: 112px; }
      .equip-leftHand { right: 10px; top: 194px; }
      .drag-ghost {
        position: fixed;
        left: 0;
        top: 0;
        width: 64px;
        z-index: 999;
        pointer-events: none;
        image-rendering: pixelated;
      }
      .drag-ghost[hidden] { display: none; }
      .selected { min-height: 1.4em; color: var(--text); }
      .log { margin: 0; padding-left: 18px; color: var(--muted); }
      .log li:first-child { color: var(--text); }
      .hint { margin-top: 24px; color: var(--muted); font-size: 11px; }
      .craft { display: flex; align-items: center; gap: 14px; }
      .craft-grid { display: grid; grid-template-columns: repeat(3, 52px); gap: 5px; }
      .craft-arrow { font-size: 20px; color: var(--muted); }
      .craft-result { width: 64px; }
      .craft-result.is-ready { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
      .craft-result.is-crafting { border-color: var(--accent); }
      .craft-cell.is-locked { opacity: 0.6; cursor: default; }
      .craft-bar { position: relative; height: 18px; margin-top: 10px; background: #0f0d14; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
      .craft-fill { height: 100%; width: 0; background: linear-gradient(#f7d47c, #d99a2e); }
      .craft-label { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--text); text-shadow: 0 1px 2px #000; }
      .points { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
      .points.has-points { color: var(--accent); }
      .upgrades { margin: 0 0 12px; padding: 0; list-style: none; display: grid; gap: 10px; }
      .upgrades li { display: grid; grid-template-columns: 1fr auto 40px; align-items: center; gap: 10px; color: var(--text); }
      .upgrades .name { display: block; font-size: 15px; font-weight: bold; }
      .upgrades .effect { display: block; margin-top: 2px; font-size: 13px; line-height: 1.35; color: var(--muted); }
      .upgrades .level { font-size: 14px; color: var(--muted); }
      .upgrades li.is-maxed .level { color: var(--accent); }
      .plus { width: 40px; height: 40px; padding: 0; font: inherit; font-size: 24px; line-height: 1; font-weight: bold; color: var(--accent); background: #0f0d14; border: 1px solid var(--accent); border-radius: 4px; cursor: pointer; }
      .plus:hover, .plus.is-hover { background: var(--accent); color: #0f0d14; }
      .plus:disabled { color: var(--muted); border-color: var(--line); background: none; cursor: default; }
      .core { margin: 0; padding: 8px; background: #0f0d14; border: 1px solid var(--line); border-radius: 4px; color: var(--accent); white-space: pre; overflow-x: auto; }
    </style>
  </head>
  <body>
    <main id="game"></main>
    <aside id="panel"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
